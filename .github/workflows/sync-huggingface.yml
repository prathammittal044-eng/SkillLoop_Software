name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'chat_events.py'
      - 'chat_routes.py'
      - 'config.py'
      - 'database.py'
      - 'institutions.py'
      - 'requirements.txt'
      - 'seed.py'
      - 'turn_config.py'
      - '.github/workflows/sync-huggingface.yml'
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload Backend Files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi, CommitOperationAdd

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise ValueError("HF_TOKEN secret is missing or empty!")

          api = HfApi(token=token)
          repo_id = "Zoggy/skillloop-backend"

          backend_files = [
              "app.py",
              "chat_events.py",
              "chat_routes.py",
              "config.py",
              "database.py",
              "institutions.py",
              "requirements.txt",
              "seed.py",
              "turn_config.py"
          ]

          operations = []
          for filename in backend_files:
              if os.path.exists(filename):
                  print(f"Staging {filename} for upload...")
                  operations.append(CommitOperationAdd(path_in_repo=filename, path_or_fileobj=filename))

          if operations:
              print(f"Pushing {len(operations)} backend files to Hugging Face Space: {repo_id}")
              api.create_commit(
                  repo_id=repo_id,
                  repo_type="space",
                  operations=operations,
                  commit_message=f"Auto-sync backend from GitHub: ${{ github.sha }}"
              )
              print("Successfully synced backend to Hugging Face Space!")
          else:
              print("No backend files found to sync.")
          EOF
