<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#543ce0"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#543ce0" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Purple rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- White infinity symbol (∞) — hand-drawn path for pixel-perfect rendering -->
  <!-- Two overlapping circles forming infinity, centered at 32,32 -->
  <g fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left lobe -->
    <path d="M32,32 C28,24 16,24 16,32 C16,40 28,40 32,32"/>
    <!-- Right lobe -->
    <path d="M32,32 C36,24 48,24 48,32 C48,40 36,40 32,32"/>
  </g>
</svg>